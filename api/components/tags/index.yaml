issue:
  message: &message
    issue:
      resolutions:
        tags: 
          - code: RESOLUTION_DETAILS
            description : Resolution details for the order issue
            reference: <PR/Issue/Discussion Links md format text>
            list: 
              - code: ITEM
                description: Item related to the resolution
                reference: <PR/Issue/Discussion Links md format text>
              - code: REFUND_AMOUNT
                description: Refund amount for the item
                reference: <PR/Issue/Discussion Links md format text>
      actions: 
        tags:
          - code: CLOSURE_DETAILS
            description: Closure details for the order issue
            reference: <PR/Issue/Discussion Links md format text>
            list:
              - code: RATING
                description: Rating given by the complainant while closing the issue
                reference: <PR/Issue/Discussion Links md format text>
      refs:
        tags:
          - code: message.order.items.id
            description: Reference to the item id in the order
            reference: <PR/Issue/Discussion Links md format text>
            list: 
             - code: quantity.selected.count
               description: Quantity selected for the item
               reference: <PR/Issue/Discussion Links md format text>
on_issue:
  message: *message