issue:
  context:
    country:
      required: mandatory
      type: string
      owner: BAP
      usage: IND
      description: Describes country code as per ISO 3166-1 and ISO 3166-2 format
    city:
      required: mandatory
      type: string
      owner: BAP
      usage: '*'
      description: Describes the city code this location is, or is located within
    domain:
      required: mandatory
      type: string
      owner: BAP
      usage: ONDC:RET10
      description: Describes domain code that is relevant to this transaction context
    timestamp:
      required: mandatory
      type: string
      owner: BAP
      usage: '2023-03-23T04:41:16Z'
      description: Describes tme of request generation in RFC3339 format
    bap_id:
      required: mandatory
      type: string
      owner: BAP
      usage: buyerNP.com
      description: Describes subscriber ID of the BAP
    transaction_id:
      required: mandatory
      type: string
      owner: BAP
      usage: 6743e9e2
      description: >-
        Describes a unique value which persists across all API calls. To be used
        the same as the order transaction_id
    message_id:
      required: mandatory
      type: string
      owner: BAP
      usage: 13ba8018f176
      description: >-
        Describes a unique value which persists during a request / callback
        cycle.
    core_version:
      required: mandatory
      type: string
      owner: BAP
      usage: 1.2.0
      description: >-
        Describes the version of transaction protocol being used by the sender.
        Depends on the domain being used
    action:
      required: mandatory
      type: string
      owner: BAP
      usage: issue
      description: >-
        Describes the protocol method being called by the sender and executed at
        the receiver.
    bap_uri:
      required: mandatory
      type: string
      owner: BAP
      usage: https://buyerNP.com/ondc
      description: Describes subscriber URL of the BAP for accepting callbacks from BPPs.
    ttl:
      required: mandatory
      type: string
      owner: BAP
      usage: PT30S
      description: >-
        Describes the duration in ISO8601 format after timestamp for which this
        message holds valid
    bpp_id:
      required: mandatory
      type: string
      owner: BPP
      usage: sellerapp.com
      description: Describes subscriber ID of the BPP
    bpp_uri:
      required: mandatory
      type: string
      owner: BPP
      usage: https://sellerapp.com/ondc
      description: Describes subscriber URL of the BPP for accepting calls from BAPs.
  message:
    issue:
      id:
        required: mandatory
        type: String
        owner: BAP
        usage: 7ed3b150-95c6-11ee-9475-039cd8109d56
        description: >-
          Network issue identifier is an unique number assigned to any complaint
          by the interfacing application at the source.
      category:
        required: mandatory
        type: String
        owner: BAP
        usage: ITEM
        description: Identifies what is the category of this issue
      sub_catagory:
        required: mandatory
        type: String
        owner: BAP
        usage: ITEM01
        description: Identifies what is the sub-category of this issue
      complainant_info:
        person:
          name:
            required: mandatory
            type: String
            owner: BAP
            usage: Rishabh
            description: >-
              Describes the name of a person in format:
              ./{given_name}/{honorific_prefix}/{first_name}/{middle_name}/{last_name}/{honorific_suffix}
        contact:
          phone:
            required: mandatory
            type: String
            owner: BAP
            usage: 87999347636
            description: Describes the contact of the complainant
          email:
            required: optional
            type: String
            owner: BAP
            usage: risha.singla@gmail.com
            description: Describes the email of the complainant
      order_details:
        id:
          required: Optional
          type: String
          owner: BAP
          usage: wtewetydug
          description: >-
            The value of this field will be the order of the order in
            consideration
        state:
          required: Optional
          type: String
          owner: BAP
          usage: Completed
          description: Describes the state of the order
        items:
          id:
            required: Optional
            type: String
            owner: BAP
            usage: 1123456677
            description: >-
              The value of this field will be the item of the order in
              consideration. Mandatory in case the category is ITEM
          quantity:
            required: Optional
            type: String
            owner: BAP
            usage: 6
            description: >-
              Describes the quantity of the item in consideration for the
              complaint
        fulfillments:
          id:
            required: Optional
            type: String
            owner: BAP
            usage: eufhruefhe12344
            description: >-
              The value of this field will be the fulfilment object of the order
              in consideration. Mandatory in case the category is FULFILLMENT
          state:
              required: Optional
              type: String
              owner: BAP
              usage: Delevered
              description: Describes the fulfillment state
        provider_id:
          required: mandatory
          type: String
          owner: BAP
          usage: MR8mcezPPQEA-r8EhP6UN9
          description: Describes the provider id
      descriptor:
        short_desc:
          required: mandatory
          type: String
          owner: BAP
          usage: Item quality
          description: Short description about issue
        long_desc:
          required: mandatory
          type: String
          owner: BAP
          usage: Item quality is not good
          description: Long description about issue
        additional_desc:
          url:
            required: optional
            type: String
            owner: BAP
            usage: false
            description: Additional description provided in a url
          content_type:
            required: optional
            type: String
            owner: BAP
            usage: fhdjfhndj
            description: Additional description content type
      description:
        image:
          required: conditionally mandatory
          type: String
          owner: BAP
          usage: >-
            "https://storage.googleapis.com/adya_upload_pdf/image/file-df7ea687-448d-464d-bf1f-4a23707beadf.png"
          description: >-
            Image in reference of the complaint. Mandatory for certain
            sub-categories depending on the category/ domain
      source:
        network_participant_id:
          required: mandatory
          type: String
          owner: BAP
          usage: buyer-app-preprod-v2.ondc.org
          description: Describes NP creating the complaint
        type:
          required: mandatory
          type: String
          owner: BAP
          usage: Consumer
          description: Describes the source type
      expected_response_time:
        duration:
          required: mandatory
          type: String
          owner: BAP
          usage: PT2H
          description: >-
            Describes time expected for processing the complaint (PROCESSING
            action)
      expected_resolution_time:
        duration:
          required: mandatory
          type: String
          owner: BAP
          usage: P2D
          description: >-
            Describes time expected for resolving the complaint (RESOLVED
            action)
      status:
        required: mandatory
        type: String
        owner: BAP
        usage: OPEN
        description: Describes issue status
      issue_type:
        required: mandatory
        type: String
        owner: BAP
        usage: false
        description: Describes issue type
      issue_action:
        complainant_actions:
          complainant_action:
            required: mandatory
            type: String
            owner: BAP
            usage: false
            description: >-
              Describes the action taken by the complainant who has raised the
              issue. To be populated when the complainant has taken any actions
              to anotate the action taken
          short_desc:
            required: mandatory
            type: String
            owner: BAP
            usage: false
            description: >-
              Details of the remarks when the issue action is changed, can be
              captured when the complainant triggers an action
          updated_at:
            required: mandatory
            type: String
            owner: BAP
            usage: '2023-12-19T05:39:05.893Z'
            description: Short description about issue
          updated_by:
            org:
              name:
                required: mandatory
                type: String
                owner: BAP
                usage: buyer-app-preprod-v2.ondc.org::ONDC:RET10"
                description: Describes an NP performing the action
            contact:
              phone:
                required: mandatory
                type: String
                owner: BAP
                usage: 9963548006
                description: Describes the contact no of the complainant
              email:
                required: mandatory
                type: String
                owner: BAP
                usage: buyer@ondc.org
                description: Describes the contact email of the complainant
            person:
              name:
                required: mandatory
                type: String
                owner: BAP
                usage: Buyer Admin
                description: Describes the name of the complainant
      created_at:
        required: mandatory
        type: String
        owner: BAP
        usage: '2023-12-19T05:39:05.893Z'
        description: Timestamp for the creation of the complaint
      updated_at:
        required: mandatory
        type: String
        owner: BAP
        usage: '2023-12-19T05:39:05.893Z'
        description: Timestamp for the capturing the time a complaint was last updated
      rating:
        required: optional
        type: String
        owner: BAP
        usage: THUMBS-UP
        description: >-
          Describes the rating of the complaint resolution provided by the
          complainant, if provided by the complainant
